# AgentSwitch agent and harness configuration (plan: docs/harness-architecture-plan.md, section 8).
# Loaded and validated at start; a missing key, unknown key or wrong type is a configuration error.
# Secrets stay in .env. Only OPENROUTER_MODEL may override a value here (it replaces models.agent).

[models]
agent = "z-ai/glm-5.3-flash"
reasoning_effort = "medium"
seed = 4042026
# Largest completion seen in runs/ is 7,776 tokens (reasoning included); 16,384 leaves 2x headroom.
max_tokens = 16384
timeout_seconds = 180.0

# Dollars per million tokens. The default row applies to any model not listed, so an unknown
# model is never free. It is a deliberately high guard, not a real price.
[pricing.default]
input_usd_per_million = 1.0
output_usd_per_million = 5.0

# OpenRouter list price, checked 2026-09-19.
[pricing.models."z-ai/glm-5.3-flash"]
input_usd_per_million = 0.09
output_usd_per_million = 0.30

[budgets]
# Per task run; plan section 14, answer 1.
run_usd = 0.25
# Per rubric judge call; plan section 14, answer 1.
judge_usd = 0.05
# One round is one model call from the agent loop; retries are extra attempts in that round.
# 3 per round keeps today's two retries; 90 per run is 30 turns x 3.
max_attempts_per_round = 3
max_attempts_per_run = 90
# Multiplies the character-based input-token estimate before admission.
admission_safety_factor = 1.25

[limits]
# Graph agent limits (plan sections 5.2-5.4). Python keeps the safety rules config must not relax.
# Threads that run read nodes at once (1-8). The reschedule and answer nodes always run alone.
# Phase 5 exit runs passed at 4 (2026-09-19).
max_workers = 4
# "frontier": one planner call after each accepted patch settles. "node": after every outcome (S17);
# node mode runs one node at a time whatever max_workers says.
replan = "frontier"
# New nodes one patch may add. The deterministic late_with_cause run makes 17 distinct reads on
# Suryodaya (2026-09-19), so one frontier can cover the required reads.
max_new_tasks = 24
max_nodes = 64
# Hard repairs fix rule-breaking patches; when they run out the run fails. Soft repairs name
# missing evidence; when they run out the answer is accepted with the missing reads as unknowns.
hard_repairs = 5
soft_repairs = 2
# Rows per MCP list page for graph read nodes.
page_size = 1000
# Characters of each node's outcome shown to the planner, and of all outcomes together per round.
projection_chars = 4000
projection_total_chars = 40000

[evals]
# Secondary rubric judge settings (plan sections 7.5 and 8).
judge_model = "z-ai/glm-5.3-flash"
scale_max = 2
floor = 1
threshold = 1.5

[evals.weights]
addresses_task = 1
specific = 1
consistent = 1
complete = 1
meets_expectation = 1
