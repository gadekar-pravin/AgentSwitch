[project]
name = "agentswitch"
version = "0.1.0"
description = "Seat 04 Production agent and harness for the AgentSwitch capstone"
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
# Not installed: `agentswitch/` is imported from the repo root (see pytest pythonpath below).
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
# Pinned so every machine checks the same rules.
select = ["E4", "E7", "E9", "F", "W", "I"]
